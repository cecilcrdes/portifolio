name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let an active Pages deployment finish; a newer push can run immediately after it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static frontend
        run: pnpm exec vite build --config vite.config.ci.ts
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Prepare project routes and SPA fallback
        run: node scripts/prepare-pages.mjs

      - name: Verify Pages artifact
        run: |
          test -s dist/public/index.html
          test -s dist/public/404.html
          test -f dist/public/.nojekyll
          test -s dist/public/cases/in9-midia/index.html
          test -s dist/public/en/cases/in9-midia/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
